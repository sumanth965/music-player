services:
  # ─── Swar Music Player Express Backend Service ──────────────────────────────
  - type: web
    name: swar-player-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: GENIUS_ACCESS_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # ─── Swar Music Player React + Vite Static Frontend ─────────────────────────
  - type: static
    name: swar-player-web
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: swar-player-api
          envVarKey: RENDER_EXTERNAL_URL
