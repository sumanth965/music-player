services:
  # ─── Swar Music Player Express Backend Service ──────────────────────────────
  - type: web
    name: swar-player-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd server && npm install --include=dev && npm run build
    startCommand: cd server && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: GENIUS_ACCESS_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: https://swar-xdx8.onrender.com,http://localhost:5173,http://localhost:3000

  # ─── Swar Music Player React + Vite Static Frontend ─────────────────────────
  - type: static
    name: swar-player-web
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://swar-player-backend.onrender.com
